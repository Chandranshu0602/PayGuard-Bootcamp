<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Payment — Sampurni Tea</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#faf7f2;--brown:#2c1810;--gold:#c8902a;--gold-light:#e8b84b;--green:#2d5a27;--border:#e8e0d4;--text:#1a1208;--muted:#8a7560;--card:#fff;--red:#c0392b;}
body{background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{background:var(--brown);padding:0 3rem;height:68px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-family:'Playfair Display',serif;font-size:1.4rem;color:#fff;text-decoration:none;}
.nav-brand span{color:var(--gold-light);}
.timer{color:rgba(255,255,255,0.7);font-size:0.85rem;display:flex;align-items:center;gap:0.5rem;}
.timer-val{color:var(--gold-light);font-weight:700;font-size:1rem;}

main{max-width:520px;margin:3rem auto;padding:0 1.5rem;}

.pay-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(44,24,16,0.08);}

.pay-header{background:var(--brown);padding:1.5rem;text-align:center;color:#fff;}
.pay-header-title{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:0.4rem;}
.pay-amount{font-size:2.2rem;font-weight:700;color:var(--gold-light);margin-bottom:0.2rem;}
.pay-amount-label{font-size:0.78rem;opacity:0.7;}

.pay-body{padding:2rem;}

/* UPI SECTION */
.upi-apps{display:flex;justify-content:center;gap:1rem;margin-bottom:1.5rem;}
.upi-app{display:flex;flex-direction:column;align-items:center;gap:0.35rem;cursor:pointer;opacity:0.7;transition:opacity 0.2s;}
.upi-app:hover,.upi-app.active{opacity:1;}
.upi-app-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:2px solid transparent;}
.upi-app.active .upi-app-icon{border-color:var(--gold);}
.upi-app-name{font-size:0.65rem;font-weight:600;color:var(--muted);}
.gpay{background:linear-gradient(135deg,#4285f4,#34a853);}
.phonepe{background:linear-gradient(135deg,#5f259f,#7b2fff);}
.paytm{background:linear-gradient(135deg,#00b9f1,#0068a8);}

.qr-section{text-align:center;padding:1rem 0;}
.qr-label{font-size:0.78rem;color:var(--muted);margin-bottom:1rem;}
.qr-box{display:inline-block;background:#fff;border:2px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;position:relative;}
.qr-img{width:180px;height:180px;display:block;}
.upi-id{font-size:0.82rem;color:var(--muted);margin-bottom:1.5rem;}
.upi-id strong{color:var(--brown);}

.divider{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;color:var(--muted);font-size:0.78rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* UPI ID INPUT */
.upi-input-row{display:flex;gap:0.5rem;margin-bottom:1.25rem;}
.upi-input{flex:1;padding:0.65rem 0.85rem;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.88rem;}
.verify-btn{padding:0.65rem 1rem;background:var(--brown);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:0.82rem;font-weight:600;cursor:pointer;white-space:nowrap;}

.pay-btn{width:100%;padding:0.9rem;background:var(--green);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:background 0.2s;margin-bottom:1rem;}
.pay-btn:hover{background:#1e4a19;}

.secure-badges{display:flex;justify-content:center;gap:1.5rem;margin-top:0.5rem;}
.badge{display:flex;align-items:center;gap:0.3rem;font-size:0.68rem;color:var(--muted);}

/* TAMPER WARNING — visible in demo */
.tamper-note{background:#fff3cd;border:1px solid #fde68a;border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.75rem;color:#856404;}
.tamper-note strong{color:#664d03;}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/"><span>🍵</span> SampurniTea</a>
  <div class="timer">⏱ Expires in <span class="timer-val" id="timer">09:59</span></div>
</nav>

<main>
  <!-- TAMPER WARNING (shows vulnerability) -->
  <div class="tamper-note" id="tamper-note" style="display:none">
    ⚠ <strong>Intercepted:</strong> Total was tampered from <span id="original-amt"></span> → <strong id="tampered-amt" style="color:var(--red)"></strong>. QR is generating for the tampered amount.
  </div>

  <div class="pay-card">
    <div class="pay-header">
      <div class="pay-header-title">Complete Your Payment</div>
      <div class="pay-amount" id="pay-amount">₹0</div>
      <div class="pay-amount-label">Order ID: <span id="order-id">—</span></div>
    </div>
    <div class="pay-body">
      <div class="upi-apps">
        <div class="upi-app active">
          <div class="upi-app-icon gpay">G</div>
          <div class="upi-app-name">GPay</div>
        </div>
        <div class="upi-app">
          <div class="upi-app-icon phonepe">Pe</div>
          <div class="upi-app-name">PhonePe</div>
        </div>
        <div class="upi-app">
          <div class="upi-app-icon paytm">P</div>
          <div class="upi-app-name">Paytm</div>
        </div>
      </div>

      <div class="qr-section">
        <div class="qr-label">Scan QR code with any UPI app</div>
        <div class="qr-box">
          <!-- Dynamic QR using free API -->
          <img class="qr-img" id="qr-img" src="" alt="QR Code"/>
        </div>
        <div class="upi-id">Pay to: <strong id="upi-id-display">sampurni@paytm</strong></div>
      </div>

      <div class="divider">or pay using UPI ID</div>

      <div class="upi-input-row">
        <input class="upi-input" type="text" placeholder="Enter your UPI ID (e.g. name@upi)"/>
        <button class="verify-btn">Verify</button>
      </div>

      <button class="pay-btn" onclick="confirmPayment()">Pay Now →</button>

      <div class="secure-badges">
        <div class="badge">🔒 256-bit SSL</div>
        <div class="badge">🛡 PCI DSS</div>
        <div class="badge">✓ RBI Compliant</div>
      </div>
    </div>
  </div>
</main>

<script>
  const order = JSON.parse(localStorage.getItem('pendingOrder') || '{}');

  function fmt(p){ return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(p); }

  function init() {
    if (!order.orderId) { window.location.href = '/'; return; }

    const amount = order.paymentAmount;
    const formattedAmt = fmt(amount);

    document.getElementById('pay-amount').textContent = formattedAmt;
    document.getElementById('order-id').textContent = order.orderId;
    document.getElementById('upi-id-display').textContent = order.upiId || 'sampurni@paytm';

    // Generate QR code for UPI payment
    // UPI deep link format: upi://pay?pa=VPA&pn=NAME&am=AMOUNT&cu=INR
    const upiLink = `upi://pay?pa=${order.upiId}&pn=${encodeURIComponent(order.upiName)}&am=${(amount/100).toFixed(2)}&cu=INR&tn=Order+${order.orderId}`;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
    document.getElementById('qr-img').src = qrApiUrl;

    // Show tamper note if amount looks tampered (very small)
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const realTotal = cart.reduce((s,i)=>s+i.price*i.qty,0) + (cart.reduce((s,i)=>s+i.price*i.qty,0) >= 99900 ? 0 : 9900);
    if (amount < realTotal * 0.5) {
      document.getElementById('tamper-note').style.display = 'block';
      document.getElementById('original-amt').textContent = fmt(realTotal);
      document.getElementById('tampered-amt').textContent = formattedAmt;
    }
  }

  // Timer countdown
  let secs = 599;
  const timerEl = document.getElementById('timer');
  setInterval(() => {
    if (secs <= 0) return;
    secs--;
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = (secs%60).toString().padStart(2,'0');
    timerEl.textContent = m+':'+s;
    if (secs < 60) timerEl.style.color = '#e8b84b';
    if (secs < 30) timerEl.style.color = '#dc2626';
  }, 1000);

  async function confirmPayment() {
    if (!order.orderId) return;
    await fetch(`/api/orders/${order.orderId}/confirm`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    localStorage.removeItem('cart');
    localStorage.removeItem('pendingOrder');
    localStorage.setItem('lastOrder', JSON.stringify(order));
    window.location.href = '/order-success';
  }

  init();
</script>
</body>
</html>
